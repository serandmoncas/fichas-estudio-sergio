name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dominio:
    name: Dominio (FichasCore)
    runs-on: ubuntu-latest
    # XCTest en Linux puede colgarse sin terminar; mejor fallar pronto que esperar 6 horas.
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Compilar
        run: swift build --build-tests
      - name: Pruebas compartidas
        run: swift test

  app:
    name: App (iOS y macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # En Linux, FichasDatos compila vacío; aquí sí corren sus pruebas con SwiftData.
      - name: Pruebas en macOS
        run: swift test
      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen
      - name: Compilar para macOS
        run: xcodebuild -project Fichas.xcodeproj -scheme Fichas -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Compilar para iOS
        run: xcodebuild -project Fichas.xcodeproj -scheme Fichas -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Pruebas de interfaz en el simulador de iOS
        run: |
          # El primer iPhone disponible, para no depender de un nombre fijo de simulador.
          SIMULADOR=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          # Con teclado físico no aparece el teclado en pantalla ni su tutorial, que interrumpe las pruebas.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          xcrun simctl boot "$SIMULADOR"
          xcrun simctl bootstatus "$SIMULADOR"
          xcodebuild test -project Fichas.xcodeproj -scheme Fichas -destination "id=$SIMULADOR" \
            -resultBundlePath PruebasUI.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Guardar resultados de las pruebas de interfaz
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PruebasUI.xcresult
          path: PruebasUI.xcresult
